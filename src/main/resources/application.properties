spring.application.name=supportdesk-ai
spring.datasource.url=jdbc:mysql://localhost:3306/supportdesk?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Abdo#1234
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
logging.level.org.springframework.security=DEBUG

# JWT config - secret comes from env var in real deployments (never commit real secrets)
jwt.secret=${JWT_SECRET:dev-only-local-secret-change-me-please-32chars-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}