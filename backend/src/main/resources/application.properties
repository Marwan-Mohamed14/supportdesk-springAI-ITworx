spring.application.name=supportdesk-ai

spring.datasource.url=jdbc:mysql://localhost:3306/supportdesk?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=kjh1007n@5a

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
jwt.secret=${JWT_SECRET:dev-only-local-secret-change-me-please-32chars-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:3600000}

# Bootstrap admin seeded on startup if no user exists with this email yet (see DataSeeder).
# Override via env vars in any shared/deployed environment - do not keep the default password.
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:System Admin}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@itworx.com}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}

# CORS: allow the Vite dev server to call this API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}


spring.config.import=optional:file:.env[.properties]

spring.ai.openai.api-key=${GROQ_API_KEY}
# Spring AI 2.0's OpenAI client (backed by the official openai-java SDK) needs the
# /v1 segment explicit in the base URL - Spring AI 1.0's client added it implicitly,
# which is why the demo's plain "https://api.groq.com/openai" worked there but not here.
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# Embeddings via Ollama, running locally - free, but means whichever machine runs
# this backend (a dev's laptop today, a real server later) needs Ollama installed
# and `ollama pull nomic-embed-text` run once. End users of the deployed app never
# see or install this - they only ever talk to the backend over HTTP.
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text

spring.ai.model.chat=openai
spring.ai.model.embedding=ollama
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health